# Service-to-Server Mapping for Kamal
# Maps docker-compose services to deployment servers/roles

servers:
  docker:
    host: docker.lan
    user: root
    services:
      - plex
      - adguardhome
      - nginx-proxy
      - prometheus
      - grafana
      - speedtest
      - docker-registry
      - upsnap
      - komodo
      - uptime-kuma
      - status-page
      - cloudflare-ddns
      - container-mgmt
      - wireguard-vpn
      - lanindex
      - viewtube
      - privatebin

  pi01:
    host: pi01.lan
    user: nathan
    services:
      - woodpecker

  octoprint:
    host: octoprint.lan
    user: admin
    services:
      - zigbee2mqtt

# Secrets (environment variables that should be marked as secret in Kamal)
secrets:
  - PLEX_CLAIM
  - PLEX_CLAIM_TOKEN
  - ADMIN_PASSWORD
  - PASSWORD
  - WIREGUARD_ADMIN_PASSWORD
  - MQTT_PASSWORD
  - MQTT_USER
  - VPN_PASSWORD
  - VPN_USERNAME
  - ADGUARD_PASSWORD
  - GITHUB_CLIENT_SECRET
  - WOODPECKER_AGENT_SECRET

# Default healthcheck (can be overridden per service)
default_healthcheck:
  interval: 30s
  timeout: 10s
  retries: 3

# Build the lanindex image on pi01's agent (arm64, native), push to the LAN
# registry, then ask Komodo to redeploy the stack.
# The agent uses the host Docker daemon, which trusts ncr.lan:80 (ansible/roles/docker).
when:
  - event: push
    branch: main
    path: ["lanindex/**", ".woodpecker/lanindex.yaml", "stacks/lanindex/**"]

steps:
  build-push:
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build -t ncr.lan:80/lanindex:${CI_COMMIT_SHA} -t ncr.lan:80/lanindex:latest lanindex
      - docker push ncr.lan:80/lanindex:${CI_COMMIT_SHA}
      - docker push ncr.lan:80/lanindex:latest

  deploy:
    image: curlimages/curl
    environment:
      KOMODO_API_KEY:
        from_secret: komodo_api_key
      KOMODO_API_SECRET:
        from_secret: komodo_api_secret
    commands:
      - >
        curl -fsS -X POST http://pi01.lan:9120/execute/DeployStack
        -H "Content-Type: application/json"
        -H "X-Api-Key: $KOMODO_API_KEY"
        -H "X-Api-Secret: $KOMODO_API_SECRET"
        -d '{"stack": "lanindex"}'

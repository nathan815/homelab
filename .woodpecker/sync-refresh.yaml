# Refresh the Komodo "homelab" resource sync when komodo/komodo.toml changes on
# main. Refresh only re-reads the toml and records the Pending diff (alerting if
# the sync has pending_alert on); it never applies. Review Pending in the Komodo
# UI and press Execute yourself. Runs on the self-hosted agent, so Core never
# needs to be reachable from the internet.
when:
  - event: push
    branch: main
    path: komodo/komodo.toml

steps:
  refresh:
    image: alpine:3@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    environment:
      KOMODO_URL: http://pi01.lan:9120
      KOMODO_API_KEY:
        from_secret: komodo_api_key
      KOMODO_API_SECRET:
        from_secret: komodo_api_secret
    commands:
      - apk add --no-cache curl jq
      - sh ci/komodo-sync-refresh.sh

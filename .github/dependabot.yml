version: 2
updates:
  - package-ecosystem: docker-compose
    directories:
      - "/stacks/*"
    schedule:
      interval: weekly
    groups:
      stack-images:
        patterns: ["*"]
    # Majors that need a planned migration. Remove an entry once that
    # migration is done so dependabot tracks the new major again.
    ignore:
      # Komodo's DB: tag leads with the Postgres major (17-...); a new one needs pg_upgrade or dump/restore.
      # Remove once the upgrade is done (see the tracking issue).
      - dependency-name: "ferretdb/postgres-documentdb"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories:
      - "/ansible"
      - "/apps/lanindex"
    schedule:
      interval: weekly
    groups:
      dockerfile-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

version: 2
updates:
  - package-ecosystem: docker-compose
    directories:
      - "/stacks/*"
    schedule:
      interval: weekly
    groups:
      stack-images:
        patterns: ["*"]
    # Majors that need a planned migration. Remove an entry once that
    # migration is done so dependabot tracks the new major again.
    ignore:
      # Komodo's DB: tag leads with the Postgres major (17-...); a new one needs pg_upgrade or dump/restore.
      - dependency-name: "ghcr.io/ferretdb/postgres-documentdb"
        update-types: ["version-update:semver-major"]
      # 3.x: new default config path, drops schema1 manifests; verify with registry-ui first.
      - dependency-name: "registry"
        update-types: ["version-update:semver-major"]
      # 5.x: one-way config/fastresume migration, WebAPI pause/resume renamed to stop/start.
      - dependency-name: "linuxserver/qbittorrent"
        update-types: ["version-update:semver-major"]
      # 5.x: device cron expressions must be rewritten to the new format.
      - dependency-name: "ghcr.io/seriousm4x/upsnap"
        update-types: ["version-update:semver-major"]
      # Majors must go one at a time with setFeatureCompatibilityVersion between them.
      - dependency-name: "mongo"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories:
      - "/ansible"
      - "/apps/lanindex"
    schedule:
      interval: weekly
    groups:
      dockerfile-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

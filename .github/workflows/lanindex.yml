# Build the lanindex image on GitHub's hosted arm64 runner, push to ghcr.io,
# then create a GitHub deployment. Woodpecker listens for that deployment
# event and tells Komodo to redeploy (.woodpecker/deploy-lanindex.yaml).
name: lanindex

on:
  push:
    branches: [main]
    paths: ["lanindex/**", "stacks/lanindex/**", ".github/workflows/lanindex.yml"]

permissions:
  contents: read
  packages: write
  deployments: write

jobs:
  build-deploy:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: lanindex
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lanindex:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/lanindex:latest
      - name: Create GitHub deployment (triggers Woodpecker)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/deployments" \
            -f ref="${{ github.sha }}" -f environment=production \
            -f task="deploy:lanindex" -F auto_merge=false \
            -F 'required_contexts[]'

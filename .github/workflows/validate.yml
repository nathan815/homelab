# PR validation on GitHub-hosted runners (no LAN access, no secrets).
# Pushes to main run it via deploy.yml, which gates deploys on it.
name: Validate

on:
  workflow_call:
    inputs:
      ref:
        description: "Ref to validate (default: the triggering commit)"
        type: string
        default: ""
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Compose, shell, YAML, Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Images are pinned by digest
        run: .github/scripts/check_pinned_images.py
      - name: docker compose config
        run: |
          for f in stacks/*/docker-compose.yml; do
            echo "Checking $f"
            if [ ! -s "$f" ]; then echo "::warning file=$f::empty compose file, skipping"; continue; fi
            # Fill unset ${VAR}s from .env.defaults so config renders
            env_file=$(dirname "$f")/.env.defaults
            if [ -f "$env_file" ]; then docker compose --env-file "$env_file" -f "$f" config > /dev/null; else docker compose -f "$f" config > /dev/null; fi
          done
      - name: Healthcheck binaries exist in their images
        # An image bump can drop the tool a healthcheck calls (Loki 3.6+ is distroless: no wget/sh)
        run: python3 -I .github/scripts/check_healthchecks.py
      - name: Loki / Alloy config check
        # Run the real configs against the pinned (Dependabot-bumped) images
        run: |
          loki=$(docker compose --env-file stacks/loki/.env.defaults -f stacks/loki/docker-compose.yml config --images)
          docker run --rm -v "$PWD/stacks/loki/loki.yml:/etc/loki/loki.yml:ro" "$loki" \
            -config.file=/etc/loki/loki.yml -verify-config
          alloy=$(docker compose --env-file stacks/alloy/.env.defaults -f stacks/alloy/docker-compose.yml config --images)
          docker run --rm -e ALLOY_HOST=ci -e LOKI_URL=http://loki.invalid:3100/loki/api/v1/push \
            -v "$PWD/stacks/alloy/config.alloy:/etc/alloy/config.alloy:ro" "$alloy" validate /etc/alloy/config.alloy
      - name: nginx -t (nginx-proxy)
        # Komodo deploys nginx-proxy straight from main, so a bad config would take the LAN's web access down
        run: bash "$PWD/stacks/nginx-proxy/validate.sh"
      - name: promtool / blackbox config check (monitoring)
        run: |
          # --syntax-only: the HA token credentials_file only exists at runtime
          docker run --rm -v "$PWD/stacks/monitoring:/work:ro" --entrypoint /bin/promtool \
            prom/prometheus check config --syntax-only /work/prometheus/prometheus.yml
          docker run --rm -v "$PWD/stacks/monitoring/blackbox/config:/config:ro" \
            prom/blackbox-exporter --config.file=/config/blackbox.yml --config.check
      - name: shellcheck
        run: shellcheck --severity=error stacks/*.sh ci/*.sh komodo/scripts/*.sh
      - name: deployable stacks
        run: |
          echo "Deployable: $(python3 .github/scripts/deploy_plan.py list)"
      - name: yamllint
        run: pipx run yamllint -d relaxed ansible .woodpecker .github
      - name: ansible-lint (advisory, existing roles have violations)
        continue-on-error: true
        working-directory: ansible
        run: |
          pip install --quiet "ansible>=10" ansible-lint
          ansible-galaxy role install -r requirements.yml
          ansible-lint playbooks/

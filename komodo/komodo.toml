# Komodo Resource Sync: declares servers, stacks and other resources.
# Applied by the "homelab" resource_sync (Komodo UI: Syncs -> homelab).
#
# IMPORTANT: a sync makes Komodo match this file. The sync has delete off, so
# resources only in Komodo are left alone, but always review the sync's
# pending diff before pressing Execute. Add new resources here, not in the UI.
#
# Komodo v2 (#6). Field names checked against komodo_client v2.3.4.
#
# Who owns which folder on a host (komodo/README.md, "Folder ownership"):
# - /opt/stacks/<name>: Ansible's deploy-stack role (copies stacks/<name>).
#   `files_on_host = true` stacks run from there and MUST set an absolute
#   run_directory: in v2 a relative one resolves under Periphery's stack dir.
# - /opt/komodo/stacks/<name>: Komodo (Periphery root /opt/komodo). Git-backed
#   stacks (`repo` + `run_directory = "stacks/<name>"`) are cloned there; CI
#   deploys them (see komodo/README.md). Disposable, re-cloned on demand.
# - /opt/appdata/<name>: runtime data, owned by neither (#9).

# Periphery connects out to Core (stacks/komodo-periphery), so no address.
# Each server is first created by its Periphery's onboarding key, then adopted
# by this sync (same name).
[[server]]
name = "docker-main"
[server.config]
enabled = true

##

[[server]]
name = "pi01"
[server.config]
enabled = true

##

# Git-backed: compose files come from this repo, image from ghcr.io (built from
# apps/lanindex and deployed by .github/workflows/deploy.yml + Woodpecker).
[[stack]]
name = "lanindex"
tags = ["core"]
[stack.config]
server = "pi01"
repo = "nathan815/homelab"
branch = "main"
run_directory = "stacks/lanindex"
file_paths = ["docker-compose.yml"]
# Written to the stack's .env (replaces stacks/*/.env.defaults for Komodo stacks)
# LANINDEX_IMAGE_TAG is a Komodo variable CI sets to the deployed commit sha.
environment = """
LANINDEX_PORT = 8500
IMAGE_TAG = [[LANINDEX_IMAGE_TAG]]
"""

##

[[stack]]
name = "adguardhome"
[stack.config]
server = "pi01"
poll_for_updates = true
files_on_host = true
run_directory = "/opt/stacks/adguardhome"
file_paths = ["docker-compose.yml"]

##

# cAdvisor + Dockge, deployed by Ansible (base.yml). Periphery moved out to
# stacks/komodo-periphery, so redeploying this from Komodo is safe now.
[[stack]]
name = "container-mgmt:docker-main"
[stack.config]
server = "docker-main"
project_name = "container-mgmt"
poll_for_updates = true
files_on_host = true
run_directory = "/opt/stacks/container-mgmt"
file_paths = ["docker-compose.yml"]

##

[[stack]]
name = "container-mgmt:pi01"
[stack.config]
server = "pi01"
project_name = "container-mgmt"
poll_for_updates = true
files_on_host = true
run_directory = "/opt/stacks/container-mgmt"
file_paths = ["docker-compose.yml"]

##

[[stack]]
name = "media-system"
[stack.config]
server = "docker-main"
poll_for_updates = true
files_on_host = true
run_directory = "/opt/stacks/media-system"
file_paths = ["docker-compose.yml"]

##

# Git-backed (was an Ansible role, see #7). Secrets are Komodo secret variables
# (Settings -> Variables), interpolated into the stack's .env at deploy time.
[[stack]]
name = "monitoring"
tags = ["core"]
[stack.config]
server = "pi01"
poll_for_updates = true
repo = "nathan815/homelab"
branch = "main"
run_directory = "stacks/monitoring"
file_paths = ["docker-compose.yml"]
environment = """
PROMETHEUS_PORT = 3001
GRAFANA_PORT = 3000
GRAFANA_ADMIN_USER = admin
GRAFANA_ADMIN_PASSWORD = [[GRAFANA_ADMIN_PASSWORD]]
HOME_ASSISTANT_TOKEN = [[HOME_ASSISTANT_TOKEN]]
"""

##

[[stack]]
name = "nginx-proxy"
[stack.config]
server = "pi01"
poll_for_updates = true
files_on_host = true
run_directory = "/opt/stacks/nginx-proxy"
file_paths = ["docker-compose.yml"]

##

# Replaces the procedure Komodo creates on a fresh install
# (KOMODO_DISABLE_INIT_RESOURCES=true in stacks/komodo). Backups land in
# /opt/appdata/komodo/backups on pi01 (last 14 kept).
[[procedure]]
name = "Backup Core Database"
description = "Triggers the Core database backup at the scheduled time."
tags = ["system"]
config.schedule = "Every day at 03:00"

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [
  { execution.type = "BackupCoreDatabase", execution.params = {}, enabled = true }
]

##

# The "homelab" resource_sync itself is deliberately NOT declared here: a sync
# can't update its own resource while it is running ("resource busy"). It is
# defined once in the Komodo UI; its config is recorded in komodo/bootstrap.toml
# (not read by this sync) so it can be recreated.

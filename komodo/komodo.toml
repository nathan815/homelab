# Komodo Resource Sync: declares servers, stacks and other resources.
# Applied by the "homelab" resource_sync (Komodo UI: Syncs -> homelab).
#
# IMPORTANT: a sync makes Komodo match this file. The sync has delete off, so
# resources only in Komodo are left alone, but always review the sync's
# pending diff before pressing Execute. Add new resources here, not in the UI.
#
# Komodo v2 (#6). Field names checked against komodo_client v2.3.4.
#
# Who owns which folder on a host (komodo/README.md, "Folder ownership"):
# - /opt/stacks/<name>: Ansible's deploy-stack role (copies stacks/<name>).
#   `files_on_host = true` stacks run from there and MUST set an absolute
#   run_directory: in v2 a relative one resolves under Periphery's stack dir.
# - /opt/komodo/stacks/<name>: Komodo (Periphery root /opt/komodo). Git-backed
#   stacks (`repo` + `run_directory = "stacks/<name>"`) are cloned there; CI
#   deploys them (see komodo/README.md). Disposable, re-cloned on demand.
# - /opt/appdata/<name>: runtime data, owned by neither (#9).
#
# Git-backed stacks with data set pre_deploy to komodo/scripts/backup-stack.sh
# (#41, copy the `monitoring` block).

# Periphery connects out to Core (stacks/komodo-periphery), so no address.
# Each server is first created by its Periphery's onboarding key, then adopted
# by this sync (same name).
[[server]]
name = "docker-main"
[server.config]
enabled = true

##

[[server]]
name = "pi01"
[server.config]
enabled = true

##

# Git-backed: compose files come from this repo, image from ghcr.io (built from
# apps/lanindex and deployed by .github/workflows/deploy.yml + Woodpecker).
[[stack]]
name = "lanindex"
tags = ["core"]
[stack.config]
server = "pi01"
repo = "nathan815/homelab"
branch = "main"
run_directory = "stacks/lanindex"
file_paths = ["docker-compose.yml"]
# Written to the stack's .env (replaces stacks/*/.env.defaults for Komodo stacks)
# LANINDEX_IMAGE_TAG is a Komodo variable CI sets to the deployed commit sha.
environment = """
LANINDEX_PORT = 8500
IMAGE_TAG = [[LANINDEX_IMAGE_TAG]]
"""


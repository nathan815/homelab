# cAdvisor + Dockge, one stack per Komodo server. Periphery moved out to
# stacks/komodo-periphery, so redeploying this from Komodo is safe. A folder
# shared by several servers is one stack per server, named <folder>_<server>;
# CI deploys all of them when stacks/<folder>/ changes (deploy_plan.py).
# octoprint, which is not a Komodo server, stays on Ansible.
# Komodo v2 stores ':' in names as '_', so use the stored form here or every
# sync tries to create the stack again ("Resource ... already exists").
[[stack]]
name = "container-mgmt_docker-main"
[stack.config]
server = "docker-main"
project_name = "container-mgmt"
poll_for_updates = true
repo = "nathan815/homelab"
branch = "main"
run_directory = "stacks/container-mgmt"
file_paths = ["docker-compose.yml"]
pre_deploy.command = "sh ../../komodo/scripts/backup-stack.sh backup"


##

# Replaces the procedure Komodo creates on a fresh install
# (KOMODO_DISABLE_INIT_RESOURCES=true in stacks/komodo). Backups land in
# /opt/appdata/komodo/backups on pi01 (last 14 kept).
[[procedure]]
name = "Backup Core Database"
description = "Triggers the Core database backup at the scheduled time."
tags = ["system"]
config.schedule = "Every day at 03:00"

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [
  { execution.type = "BackupCoreDatabase", execution.params = {}, enabled = true }
]

##

# The "homelab" resource_sync itself is deliberately NOT declared here: a sync
# can't update its own resource while it is running ("resource busy"). It is
# defined once in the Komodo UI; its config is recorded in komodo/bootstrap.toml
# (not read by this sync) so it can be recreated.

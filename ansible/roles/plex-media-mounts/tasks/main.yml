# Cutover note: the original single-drive layout mounted the 2TB directly at the pool path. Before
# running this role the first time, stop the media stack and `umount {{ plex_media_pool_path }}`;
# the assert below refuses to run while a plain disk is still mounted there.
- name: Check what is currently mounted at the pool path
  ansible.builtin.set_fact:
    plex_media_pool_current_fstype: >-
      {{ (ansible_mounts | selectattr('mount', 'equalto', plex_media_pool_path) | map(attribute='fstype') | list | first) | default('') }}
  tags: [plex, mounts]

- name: Refuse to run while a plain disk is still mounted at the pool path
  ansible.builtin.assert:
    that: plex_media_pool_current_fstype in ['', 'fuse.mergerfs']
    fail_msg: >-
      {{ plex_media_pool_path }} is currently a plain {{ plex_media_pool_current_fstype }} mount.
      Stop the media stack and unmount it first (see the cutover note at the top of this role).
  tags: [plex, mounts]

- name: Install mergerfs
  ansible.builtin.apt:
    deb: "{{ mergerfs_deb_url }}"
  tags: [plex, mounts]

- name: Create mount points
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop: "{{ plex_media_disks | map(attribute='path') | list + [plex_media_pool_path] }}"
  tags: [plex, mounts]

- name: Mount each media disk
  ansible.posix.mount:
    src: "UUID={{ item.uuid }}"
    path: "{{ item.path }}"
    fstype: ext4
    state: mounted
    opts: defaults,nofail
    dump: 0
    passno: 2
  loop: "{{ plex_media_disks }}"
  tags: [plex, mounts]

- name: Make each disk root owned by the media user
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ ansible_ssh_user }}"
    group: "{{ ansible_ssh_user }}"
    mode: '0755'
  loop: "{{ plex_media_disks }}"
  tags: [plex, mounts]

- name: Create shared download folders on every disk
  ansible.builtin.file:
    path: "{{ item.0.path }}/{{ item.1 }}"
    state: directory
    owner: "{{ ansible_ssh_user }}"
    group: "{{ ansible_ssh_user }}"
    mode: '0755'
  loop: "{{ plex_media_disks | product(plex_media_shared_dirs) | list }}"
  tags: [plex, mounts]

- name: Mount the mergerfs pool at {{ plex_media_pool_path }}
  ansible.posix.mount:
    src: "{{ plex_media_disks | map(attribute='path') | join(':') }}"
    path: "{{ plex_media_pool_path }}"
    fstype: fuse.mergerfs
    state: mounted
    opts: >-
      {{ (plex_media_pool_opts
          + (plex_media_disks | map(attribute='path') | map('regex_replace', '^(.*)$', 'x-systemd.requires-mounts-for=\1') | list)) | join(',') }}
    dump: 0
    passno: 0
  tags: [plex, mounts]

- name: Reload systemd so it picks up the new fstab entries
  ansible.builtin.systemd:
    daemon_reload: true
  tags: [plex, mounts]

- name: Validate /etc/fstab
  ansible.builtin.command: mount -fav
  changed_when: false
  tags: [plex, mounts]

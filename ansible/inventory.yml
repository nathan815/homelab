---
all:
  hosts:
    pi01:
      ansible_ssh_host: pi01.lan
      ansible_ssh_user: nathan
    octoprint:
      ansible_ssh_host: octoprint.lan
      ansible_ssh_user: admin
      ansible_become_password: "{{ secrets.octoprint_admin_sudo_password }}"
    proxmox01:
      ansible_ssh_host: proxmox.lan
      ansible_ssh_user: root
    docker.lan:
      ansible_ssh_host: docker.lan
      ansible_ssh_user: nathan
      ansible_become_password: "{{ secrets.docker_vm_sudo_password }}"
      # docker must not start before the passed-through media drives and the mergerfs pool are mounted
      docker_required_mounts:
        - /mnt/disk1
        - /mnt/disk2
        - /media/plexmedia01

pi:
  hosts:
    pi01:
    octoprint:

docker-hosts:
  hosts:
    pi01:
    octoprint:
    docker.lan:

# Hosts running the Komodo Periphery agent (stacks/komodo-periphery, base.yml).
# komodo_server_name must match the [[server]] name in komodo/komodo.toml.
komodo-servers:
  hosts:
    pi01:
      komodo_server_name: pi01
    docker.lan:
      komodo_server_name: docker-main

proxmox:
  hosts:
    proxmox01:

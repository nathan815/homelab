- hosts: all
  become: true
  tasks:
    - name: Install apt packages
      ansible.builtin.apt:
        name:
          - vim
          - rsync
        update_cache: yes
      tags: [deps, apt]

    - name: Create /opt/stacks
      ansible.builtin.file:
        path: /opt/stacks
        state: directory
        owner: "{{ ansible_ssh_user }}"
        group: "{{ ansible_ssh_user }}"
      tags: dirs

  roles:
    - role: geerlingguy.node_exporter
      tags: [node-exporter]
      vars:
        node_exporter_arch_map:
          armv7l: armv7
          aarch64: arm64
          x86_64: amd64
        node_exporter_arch: "{{ node_exporter_arch_map[ansible_architecture] }}"

    - role: cockpit
      tags: [cockpit]

- hosts: docker-hosts
  become: true
  pre_tasks:
    # Runtime data root: deploy-stack creates /opt/appdata/<stack> under it (issue #9)
    - name: Create /opt/appdata
      ansible.builtin.file:
        path: /opt/appdata
        state: directory
        owner: "{{ ansible_ssh_user }}"
        group: "{{ ansible_ssh_user }}"
        mode: "0755"
      tags: dirs

    # deploy-stack copies stacks/alloy over this; the .env stays
    - name: Create alloy stack folder
      ansible.builtin.file:
        path: /opt/stacks/alloy
        state: directory
        owner: "{{ ansible_ssh_user }}"
        group: "{{ ansible_ssh_user }}"
      when: inventory_hostname not in groups['komodo-servers']
      tags: alloy

    - name: Set host label in alloy .env
      ansible.builtin.lineinfile:
        path: /opt/stacks/alloy/.env
        regexp: "^ALLOY_HOST="
        line: "ALLOY_HOST={{ inventory_hostname }}"
        create: true
        mode: "0644"
        owner: "{{ ansible_ssh_user }}"
      when: inventory_hostname not in groups['komodo-servers']
      tags: alloy

  roles:
    - role: geerlingguy.pip
      tags: [pip]
      vars:
        pip_install_packages:
          - name: docker

    - role: geerlingguy.docker
      tags: [docker]
      vars:
        # docker_apt_arch: arm64
        # docker_apt_repository: "deb [arch={{ docker_apt_arch }}] https://download.docker.com/linux/raspbian {{ ansible_distribution_release }} stable"
        docker_users:
          - "{{ ansible_ssh_user }}"
        docker_daemon_options:
          insecure-registries:
            - "ncr.lan:80"
          log-driver: json-file
          log-opts:
            max-size: "10m"
            max-file: "3"

    - role: docker-requires-mounts
      tags: [docker, docker-mounts]

    # Komodo deploys this on its servers (komodo/komodo.toml); octoprint is not one.
    - role: deploy-stack
      vars:
        stack_name: container-mgmt
      when: inventory_hostname not in groups['komodo-servers']
      tags: container-mgmt

    # Log shipper (stacks/alloy -> Loki on pi01). Komodo runs it on its servers
    # (alloy_pi01, alloy_docker-main); octoprint is not one.
    - role: deploy-stack
      vars:
        stack_name: alloy
      when: inventory_hostname not in groups['komodo-servers']
      tags: alloy

# Komodo v2 Periphery (outbound to Core on pi01). Pass the one-time onboarding
# key on the first run per host: -e komodo_onboarding_key=O-... (komodo/README.md).
- hosts: komodo-servers
  become: true
  pre_tasks:
    - name: Create Komodo dirs (Periphery root; /opt/appdata for runtime data)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ansible_ssh_user }}"
        group: "{{ ansible_ssh_user }}"
        mode: "0755"
      loop:
        - /opt/komodo
        - /opt/appdata
        - /opt/stacks/komodo-periphery
      tags: komodo-periphery

    # Pre-deploy backups of stack data (komodo/scripts/backup-stack.sh, #41).
    # Root-only: the archives hold databases.
    - name: Create /opt/appdata-backups
      ansible.builtin.file:
        path: /opt/appdata-backups
        state: directory
        owner: root
        group: root
        mode: "0700"
      tags: [komodo-periphery, dirs]

    - name: Set Komodo server name in komodo-periphery .env
      ansible.builtin.lineinfile:
        path: /opt/stacks/komodo-periphery/.env
        regexp: "^KOMODO_SERVER_NAME="
        line: "KOMODO_SERVER_NAME={{ komodo_server_name }}"
        create: true
        mode: "0600"
        owner: "{{ ansible_ssh_user }}"
      tags: komodo-periphery

    - name: Set Komodo onboarding key in komodo-periphery .env
      ansible.builtin.lineinfile:
        path: /opt/stacks/komodo-periphery/.env
        regexp: "^KOMODO_ONBOARDING_KEY="
        line: "KOMODO_ONBOARDING_KEY={{ komodo_onboarding_key }}"
        mode: "0600"
      no_log: true
      when: komodo_onboarding_key is defined
      tags: komodo-periphery

  roles:
    - role: deploy-stack
      vars:
        stack_name: komodo-periphery
      tags: komodo-periphery

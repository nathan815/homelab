<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent egress approvals</title>
<style>
  body { font: 15px system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  .card { border: 1px solid #bbb; border-radius: 10px; padding: .8rem 1rem; margin: .8rem 0; }
  .card.send_data { border-color: #c60; background: #fff7ee; }
  .url { word-break: break-all; font-family: ui-monospace, monospace; font-size: 13px; }
  pre { background: #eee; padding: .4rem; white-space: pre-wrap; word-break: break-all; }
  button { font: inherit; margin: .3rem .3rem 0 0; padding: .3rem .8rem; }
  .rule { display: flex; justify-content: space-between; gap: 1rem; padding: .3rem 0; border-bottom: 1px solid #ddd; }
  .muted { color: #777; }
</style>
<h1>Agent egress approvals</h1>
<div id="pending"><p class="muted">Nothing waiting.</p></div>
<h2>Remembered rules</h2>
<div id="rules"></div>
<script>
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function refresh() {
  const [p, r] = await Promise.all([fetch('/approvals').then(x => x.json()), fetch('/rules').then(x => x.json())]);
  document.getElementById('pending').innerHTML = p.length ? p.map(c => `
    <div class="card ${c.kind}">
      <div><b>${esc(c.text)}</b></div>
      ${c.kind === 'send_data' ? `<div class="muted">body: ${c.body_size} bytes</div>${c.body_preview ? `<pre>${esc(c.body_preview)}</pre>` : ''}` : ''}
      <button data-id="${c.id}" data-d="allow_once">Allow</button>
      <button data-id="${c.id}" data-d="always_allow">Always allow</button>
      <button data-id="${c.id}" data-d="deny">Deny</button>
    </div>`).join('') : '<p class="muted">Nothing waiting.</p>';
  document.getElementById('rules').innerHTML = r.length ? r.map(x => `
    <div class="rule"><span><span class="url">${esc(x.origin)}${esc(x.path_prefix || '')}</span>
      <span class="muted">${esc(x.action)} ${esc(x.methods.join('/'))}</span></span>
      <button data-rule="${x.id}">Revoke</button></div>`).join('') : '<p class="muted">No rules.</p>';
}
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.d) await fetch(`/approvals/${b.dataset.id}/decision`, {method: 'POST', body: JSON.stringify({decision: b.dataset.d})});
  if (b.dataset.rule) await fetch(`/rules/${b.dataset.rule}`, {method: 'DELETE'});
  refresh();
});
const es = new EventSource('/events');
es.addEventListener('pending', refresh); es.addEventListener('resolved', refresh);
refresh();
</script>

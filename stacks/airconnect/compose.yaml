name: airconnect

services:
  airconnect:
    network_mode: host
    image: 1activegeek/airconnect:1.12.4@sha256:6e53db63cbafcbf804031efa85b8d31829f80c906928398960c4046adc6ca8e3
    volumes:
      - /opt/stacks_data/airconnect:/config
    environment:
      - AIRCAST_VAR=-x /config/config.xml
      - AIRUPNP_VAR=kill
    restart: unless-stopped

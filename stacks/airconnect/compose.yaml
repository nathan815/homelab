name: airconnect

services:
  airconnect:
    network_mode: host
    image: 1activegeek/airconnect:1.12.4@sha256:48f07d863f553ec8d01d6fcc514a9821f0d4789e3ea6804100cbfbe5f18e3ac0
    volumes:
      - /opt/stacks_data/airconnect:/config
    environment:
      - AIRCAST_VAR=-x /config/config.xml
      - AIRUPNP_VAR=kill
    restart: unless-stopped

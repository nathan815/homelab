name: airconnect

services:
  airconnect:
    network_mode: host
    image: 1activegeek/airconnect:1.12.4@sha256:9bc574b8a4534c8882c4f007694ee2ba45a468164e5ddf2b4a5fa59953122eb2
    volumes:
      - /opt/stacks_data/airconnect:/config
    environment:
      - AIRCAST_VAR=-x /config/config.xml
      - AIRUPNP_VAR=kill
    restart: unless-stopped

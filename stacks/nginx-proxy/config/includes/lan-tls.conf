# Include in every nginx-internal server block: serves it on 80 and 443, and redirects
# http -> https for names the cert covers (bare *.lan names stay plain http).
listen 80;
listen 443 ssl;
http2 on;

# 308, not 301: clients replay a 301'd POST as GET, which broke service-to-service API calls
if ($lan_https_redirect) {
    return 308 https://$host$request_uri;
}

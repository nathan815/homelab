include /etc/nginx/conf.d/includes/http-statuses.conf;

# Wildcard cert from the certbot service (covers lan.nathancj.com, *.lan.nathancj.com,
# *.docker.lan.nathancj.com, *.pi01.lan.nathancj.com). Bare *.lan names are not covered.
ssl_certificate     /etc/letsencrypt/live/lan.nathancj.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/lan.nathancj.com/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;

# Used by includes/lan-tls.conf: redirect plain http to https for names the cert covers
map "$scheme://$host" $lan_https_redirect {
    default 0;
    "http://lan.nathancj.com" 1;
    "~^http://.+\.lan\.nathancj\.com$" 1;
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}

server {
    server_name lan.nathancj.com home.lan;
    include /etc/nginx/conf.d/includes/lan-tls.conf;
    include /etc/nginx/conf.d/includes/custom-error-page.conf;
    location / {
        proxy_set_header Host $http_host;
        proxy_pass http://pi01.lan:8500;
    }
}


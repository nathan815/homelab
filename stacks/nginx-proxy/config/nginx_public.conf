include /etc/nginx/conf.d/includes/http-statuses.conf;

# Upstreams below go through nginx-internal, which redirects http to https and rejects
# TLS handshakes without a known SNI name
proxy_ssl_server_name on;

# Container healthcheck (docker-compose.yml). Bound to loopback, so only requests from inside
# the container reach it; published ports arrive on the container's own IP.
server {
    listen 127.0.0.1:80;
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    location / {
        return 444;
    }
}

server {
    listen       80;
    server_name  homenet.nathancj.com;

    include /etc/nginx/conf.d/includes/custom-error-page.conf;

    root /usr/share/nginx/html;
}

server {
    server_name *.nathancj.com;
    location / {
        return 444;
    }
}

server {
    server_name plex.nathancj.com;
    include /etc/nginx/conf.d/includes/custom-error-page.conf;
    location / {
        return 301 https://app.plex.tv$request_uri;
    }
}

server {
    server_name plexmonitor.nathancj.com;
    # Disabled: Tautulli <=2.16.1 / 2.17.x has unauthenticated vulns (CVE-2026-31831, -31804). Re-enable after upgrade.
    location / {
        return 444;
    }
}

server {
    server_name plexrequests.nathancj.com;
    include /etc/nginx/conf.d/includes/custom-error-page.conf;
    location / {
        proxy_pass https://plexrequests.lan.nathancj.com;
    }
}

server {
    server_name paste.nathancj.com;
    include /etc/nginx/conf.d/includes/custom-error-page.conf;
    location / {
        proxy_pass https://paste.lan.nathancj.com;
    }
}

server {
    server_name plexinvite.nathancj.com joinplex.nathancj.com;
    include /etc/nginx/conf.d/includes/custom-error-page.conf;
    location / {
        proxy_pass https://plexinvite.lan.nathancj.com;
    }
}

# Woodpecker CI webhooks (reached via the cloudflared tunnel). Only the hook endpoint is
# forwarded; the UI stays internal at woodpecker.lan.nathancj.com.
server {
    server_name ci-hooks.nathancj.com;
    include /etc/nginx/conf.d/includes/custom-error-page.conf;

    location = /api/hook {
        # Webhooks are POST only; other methods would fall through to Woodpecker's UI
        if ($request_method != POST) {
            return 444;
        }
        proxy_pass https://woodpecker.lan.nathancj.com;
    }

    location / {
        return 444;
    }
}

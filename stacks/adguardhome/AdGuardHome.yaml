http:
  pprof:
    port: 6060
    enabled: false
  address: 0.0.0.0:80
  session_ttl: 720h
users:
  - name: ${AGH_USERNAME}
    password: ${AGH_PASSWORD}
auth_attempts: 5
block_auth_min: 15
http_proxy: ""
language: ""
theme: auto
dns:
  bind_hosts:
    - 0.0.0.0
  port: 53
  anonymize_client_ip: false
  ratelimit: 0
  ratelimit_subnet_len_ipv4: 24
  ratelimit_subnet_len_ipv6: 56
  ratelimit_whitelist: []
  refuse_any: true
  upstream_dns:
    - tls://unfiltered.adguard-dns.com
    - https://cloudflare-dns.com/dns-query
  upstream_dns_file: ""
  bootstrap_dns:
    - 9.9.9.10
    - 149.112.112.10
    - 2620:fe::10
    - 2620:fe::fe:10
  # Only tried after upstream_dns fails, so with the internet down a query waits for
  # upstream_timeout on the upstreams and then again on these.
  fallback_dns:
    - 1.1.1.1
    - 8.8.8.8
  upstream_mode: parallel
  fastest_timeout: 1s
  allowed_clients: []
  disallowed_clients: []
  blocked_hosts:
    - version.bind
    - id.server
    - hostname.bind
  trusted_proxies:
    - 127.0.0.0/8
    - ::1/128
  cache_size: 4194304
  cache_ttl_min: 0
  cache_ttl_max: 0
  # Answer from expired cache entries (short TTL, refreshed in the background) instead of
  # waiting on the upstream. During an outage, names looked up in the last 12h
  # (cache_optimistic_max_age default) still answer instantly and don't hold a request slot.
  cache_optimistic: true
  bogus_nxdomain: []
  aaaa_disabled: false
  enable_dnssec: false
  edns_client_subnet:
    custom_ip: ""
    enabled: false
    use_custom: false
  # Max requests processed concurrently (AdGuard default 300). 0 means unlimited, which let
  # hung upstream requests pile up without bound and made DNS slow (issue #1). Kept at the
  # default; the outage fix is in upstream_timeout and the local-zone rules instead.
  max_goroutines: 300
  handle_ddr: true
  ipset: []
  ipset_file: ""
  bootstrap_prefer_ipv6: false
  # Was 10s. Every query held a request slot for this long per attempt (upstreams, then
  # fallback_dns) when the internet was down, so ~300 slots filled up and queries for local
  # names, which need no upstream, queued behind them. Normal upstream answers take <300ms.
  upstream_timeout: 3s
  private_networks: []
  # Reverse lookups for LAN IPs (192.168.x.x etc.) are answered NXDOMAIN locally instead of
  # being sent to the OS resolver (Docker's 127.0.0.11 -> host resolv.conf). Nothing on the LAN
  # serves these PTRs (the router answers NXDOMAIN), so no names are lost.
  use_private_ptr_resolvers: false
  local_ptr_upstreams: []
  use_dns64: false
  dns64_prefixes: []
  serve_http3: false
  use_http3_upstreams: false
  serve_plain_dns: true
  hostsfile_enabled: true
tls:
  enabled: false
  server_name: ""
  force_https: false
  port_https: 443
  port_dns_over_tls: 853
  port_dns_over_quic: 853
  port_dnscrypt: 0
  dnscrypt_config_file: ""
  allow_unencrypted_doh: false
  certificate_chain: ""
  private_key: ""
  certificate_path: ""
  private_key_path: ""
  strict_sni_check: false
querylog:
  dir_path: ""
  ignored: []
  interval: 168h
  size_memory: 1000
  enabled: true
  file_enabled: true
statistics:
  dir_path: ""
  ignored:
    - '*.lan.nathancj.com'
    - '*.lan'
  interval: 720h
  enabled: true
filters:
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
    name: AdGuard DNS filter
    id: 1
  - enabled: false
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt
    name: AdAway Default Blocklist
    id: 2
  - enabled: true
    url: https://v.firebog.net/hosts/Easyprivacy.txt
    name: Firebog Easyprivacy
    id: 1725070954
  - enabled: true
    url: https://v.firebog.net/hosts/Admiral.txt
    name: Firebog Admiral
    id: 1725070955
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_30.txt
    name: Phishing URL Blocklist (PhishTank and OpenPhish)
    id: 1725070956
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_11.txt
    name: Malicious URL Blocklist (URLHaus)
    id: 1725070957
whitelist_filters: []
# Rewrites under filtering.rewrites only answer A/AAAA. Other query types for local names,
# notably HTTPS/SVCB, which browsers and Apple devices send with every A lookup, went to
# the internet upstreams and hung for upstream_timeout when it was down (issue #1).
# These rules answer them locally with an empty NOERROR; A/AAAA are excluded, so they never
# shadow the rewrites.
#  - .lan is not a real TLD: answer every non-A/AAAA type locally.
#  - lan.nathancj.com is a public zone (e.g. ACME TXT records), so only HTTPS/SVCB.
user_rules:
  - '@@||ad.doubleclick.net^'
  - '@@||logz.io^'
  - '@@||hits.sh^'
  - '||lan^$dnstype=~A|~AAAA,dnsrewrite=NOERROR;;'
  - '||lan.nathancj.com^$dnstype=HTTPS|SVCB,dnsrewrite=NOERROR;;'
dhcp:
  enabled: false
  interface_name: ""
  local_domain_name: lan
  dhcpv4:
    gateway_ip: ""
    subnet_mask: ""
    range_start: ""
    range_end: ""
    lease_duration: 86400
    icmp_timeout_msec: 1000
    options: []
  dhcpv6:
    range_start: ""
    lease_duration: 86400
    ra_slaac_only: false
    ra_allow_slaac: false
filtering:
  blocking_ipv4: ""
  blocking_ipv6: ""
  blocked_services:
    schedule:
      time_zone: UTC
    ids: []
  protection_disabled_until: null
  safe_search:
    enabled: false
    bing: true
    duckduckgo: true
    ecosia: true
    google: true
    pixabay: true
    yandex: true
    youtube: true
  blocking_mode: nxdomain
  parental_block_host: family-block.dns.adguard.com
  safebrowsing_block_host: standard-block.dns.adguard.com
  rewrites:
    - domain: pi01.lan
      answer: 192.168.0.148
    - domain: octoprint.lan
      answer: 192.168.0.29
    - domain: johnsonnpc.lan
      answer: 192.168.0.151
    - domain: router.lan
      answer: 192.168.0.1
    - domain: hasspi.lan
      answer: 192.168.0.200
    - domain: '*.lan'
      answer: 192.168.0.148
    - domain: hass.lan
      answer: 192.168.0.134
    - domain: proxmox.lan
      answer: 192.168.0.124
    - domain: docker.lan
      answer: 192.168.0.45
    - domain: '*.lan.nathancj.com'
      answer: 192.168.0.148
    - domain: lan.nathancj.com
      answer: 192.168.0.148
    - domain: pi01.lan.nathancj.com
      answer: 192.168.0.148
    - domain: octoprint.lan.nathancj.com
      answer: 192.168.0.29
    - domain: proxmox.lan.nathancj.com
      answer: 192.168.0.124
    - domain: hass.lan.nathancj.com
      answer: 192.168.0.134
    - domain: homeassistant.lan.nathancj.com
      answer: 192.168.0.134
  safe_fs_patterns:
    - /opt/adguardhome/work/data/userfilters/*
  safebrowsing_cache_size: 1048576
  safesearch_cache_size: 1048576
  parental_cache_size: 1048576
  cache_time: 30
  filters_update_interval: 24
  blocked_response_ttl: 10
  filtering_enabled: true
  parental_enabled: false
  safebrowsing_enabled: false
  protection_enabled: true
clients:
  runtime_sources:
    whois: true
    arp: true
    rdns: true
    dhcp: true
    hosts: true
  persistent: []
log:
  enabled: true
  file: ""
  max_backups: 0
  max_size: 100
  max_age: 3
  compress: false
  local_time: false
  verbose: false
os:
  group: ""
  user: ""
  rlimit_nofile: 0
schema_version: 29

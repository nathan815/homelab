---
services:

    # AdGuardHome - http://adguard.lan/
    adguardhome:
        image: adguard/adguardhome:v0.107.80@sha256:e2e1b48c832f7705be915873f95de0d5114de573736441d7f2923a8a6293027c
        container_name: adguardhome
        labels:
            homelab.backup: "true"
        restart: always
        volumes:
            - "${APPDATA_DIR:-/opt/appdata}/adguardhome/work:/opt/adguardhome/work"
            - "${APPDATA_DIR:-/opt/appdata}/adguardhome/config:/opt/adguardhome/conf:rw"
        ports:
            - ${AGH_UI_PORT:-4000}:80/tcp # Web interface
            - ${AGH_IP:-192.168.0.148}:53:53/tcp # DNS
            - ${AGH_IP:-192.168.0.148}:53:53/udp # DNS
            #- "9999:3000/tcp" # Install web interface. Only needed at first setup.
            #- 67:67/udp # DHCP
            #- 68:68/udp # DHCP
            #- 443:443/tcp # DNS over HTTPS
            #- 443:443/udp # DNS over HTTPS
            #- 853:853/tcp # DNS over TLS
            #- 853:853/udp # DNS over QUIC
            #- 5443:5443/tcp # DNSCrypt
            #- 5443:5443/udp # DNSCrypt
            #- 6060:6060/tcp # Debugging profiles
        networks:
            - dns_network
        healthcheck:
            test: wget --no-verbose --tries=1 --spider "http://localhost:80" || exit 1
            interval: 10s

networks:
  dns_network:
    name: dns_network

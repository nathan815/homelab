services:
  tailscale:
    container_name: tailscale
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    hostname: ${TS_HOSTNAME}
    # Host networking so the node can route to the LAN and act as an exit node.
    network_mode: host
    restart: always
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      # Advertise the LAN (subnet router) and offer this node as an exit node.
      # Both still need approval in the admin console (Machines > Edit route settings).
      - TS_ROUTES=${TS_ROUTES}
      - TS_EXTRA_ARGS=--advertise-exit-node
    volumes:
      - tailscale_state:/var/lib/tailscale

volumes:
  tailscale_state:

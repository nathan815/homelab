# Komodo v2 Core + database (FerretDB v2 on Postgres/DocumentDB), on pi01.
# Based on compose/ferretdb.compose.yaml from moghtech/komodo v2.3.4.
#
# Deployed by Ansible (ansible/playbooks/core-services.yml, tag komodo), never by
# Komodo itself: Core can't safely redeploy its own stack. Periphery is not in
# this stack; it runs on every host from stacks/komodo-periphery.
#
# Secrets come from .env next to this file on the host (not in git, see
# .env.defaults). Everything else Komodo needs (servers, stacks, procedures)
# comes from komodo/komodo.toml via the resource sync. Runbook: komodo/README.md.
#
# Keep komodo-core and stacks/komodo-periphery on the same version.

services:
  postgres:
    # FerretDB and its DocumentDB build are released in pairs: bump both together.
    image: ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0@sha256:2386795ec2aa7ae559304361979f1dc5708d383ee9020ae63dadc2940dfe58f7
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    logging:
      driver: local
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${KOMODO_DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
      POSTGRES_DB: postgres # Do not change

  ferretdb:
    image: ghcr.io/ferretdb/ferretdb:2.7.0@sha256:5706414241eb84f0515512c37b46db0f1b1eac9e5ceb7e4c2523211c184b1985
    labels:
      komodo.skip:
    restart: unless-stopped
    depends_on:
      - postgres
    logging:
      driver: local
    volumes:
      - ferretdb-state:/state
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${KOMODO_DATABASE_USERNAME}:${KOMODO_DATABASE_PASSWORD}@postgres:5432/postgres

  core:
    image: ghcr.io/moghtech/komodo-core:2.3.4@sha256:91b2afd7b3bb2abea0ebd3046d65ec457eb1f3d505868d1d60cb0f8562490ef9
    labels:
      komodo.skip:
    init: true
    restart: unless-stopped
    depends_on:
      - ferretdb
    logging:
      driver: local
    ports:
      - 9120:9120
    volumes:
      # Core's private key (core.key). Periphery agents trust its public key
      # (TOFU on first connect), so losing this volume means re-onboarding them.
      - keys:/config/keys
      # Dated database backups from the "Backup Core Database" procedure
      # (host data root /opt/appdata/<stack>, see komodo/README.md).
      - /opt/appdata/komodo/backups:/backups
    environment:
      # Full list: https://github.com/moghtech/komodo/blob/v2.3.4/config/core.config.toml
      KOMODO_DATABASE_ADDRESS: ferretdb:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DATABASE_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
      TZ: America/Detroit # schedules (database backup) use this

      KOMODO_HOST: http://komodo.lan.nathancj.com
      KOMODO_TITLE: Komodo
      KOMODO_MONITORING_INTERVAL: 15-sec
      KOMODO_RESOURCE_POLL_INTERVAL: 1-hr
      # Default procedures are declared in komodo/komodo.toml instead.
      KOMODO_DISABLE_INIT_RESOURCES: "true"
      # No local Periphery here: pi01's agent connects in from komodo-periphery.
      # Servers are created by onboarding keys (see komodo/README.md).

      KOMODO_LOCAL_AUTH: "true"
      KOMODO_INIT_ADMIN_USERNAME: ${KOMODO_INIT_ADMIN_USERNAME}
      # Only used on the very first start (empty database); change it in the UI after.
      KOMODO_INIT_ADMIN_PASSWORD: ${KOMODO_INIT_ADMIN_PASSWORD}
      KOMODO_DISABLE_USER_REGISTRATION: "true"
      KOMODO_ENABLE_NEW_USERS: "false"
      KOMODO_DISABLE_NON_ADMIN_CREATE: "false"
      KOMODO_TRANSPARENT_MODE: "false"
      KOMODO_JWT_TTL: 1-day
      KOMODO_OIDC_ENABLED: "false"
      KOMODO_GITHUB_OAUTH_ENABLED: "false"
      KOMODO_GOOGLE_OAUTH_ENABLED: "false"

      KOMODO_JWT_SECRET: ${KOMODO_JWT_SECRET}
      KOMODO_WEBHOOK_SECRET: ${KOMODO_WEBHOOK_SECRET}

volumes:
  postgres-data:
  ferretdb-state:
  keys:
  # The v1 FerretDB/SQLite volume (komodo_sqlite-data) is deliberately not
  # declared: it stays on pi01, untouched, as the rollback copy.

---
services:
  plex:
    image: lscr.io/linuxserver/plex:1.43.5@sha256:01a53d9c7adcbb3701fbb0a4230c0a37c85453759b6b05a67356c3c7a09de08d
    container_name: plex
    restart: always
    network_mode: host

    environment:
      - PUID=1000
      - PGID=1000
      - VERSION=docker
      - TZ=America/Detroit

    volumes:
      - "${APPDATA_DIR:-/opt/appdata}/media-system/plex:/config"
      - /media/plexmedia01:/Media:ro
    tmpfs:
      - /transcode:size=1G
    healthcheck:
      test: wget --no-verbose --tries=1 --spider "http://localhost:32400/identity"
      interval: 30s

  tautulli:
    image: ghcr.io/tautulli/tautulli:v2.18.2@sha256:1b5875fe3193d450a62e7b438eb6701195c841f14f3dcb962e545eda42d3696f
    container_name: plex-tautulli
    restart: always
    volumes:
      - "${APPDATA_DIR:-/opt/appdata}/media-system/tautulli:/config"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Detroit
    ports:
      - "${TAUTULLI_PORT}:8181"

  overseerr:
    # Seerr, the Overseerr successor. Migrates the old Overseerr config on first start.
    # Runs as node (1000:1000) with no init of its own, so it needs init: true.
    image: ghcr.io/seerr-team/seerr:v3.5.1@sha256:d8fab675b55ad293ded98fd71efcfd46054cbad9746534ae1cc4794a88c0b3be
    container_name: plex-overseerr
    restart: always
    init: true
    environment:
      - TZ=America/Detroit
    volumes:
      - "${APPDATA_DIR:-/opt/appdata}/media-system/overseerr:/app/config"
    ports:
      - "${OVERSEERR_PORT}:5055"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider "http://localhost:5055/api/v1/settings/public"
      interval: 30s
      start_period: 60s

  wizarr:
    image: ghcr.io/wizarrrr/wizarr:v2026.10.1@sha256:08f2c6de534ec7d36d39a4f55b7c5c379021ca881dc519c702aad0ddafbdc67a
    container_name: plex-wizarr
    restart: unless-stopped
    volumes:
      - "${APPDATA_DIR:-/opt/appdata}/media-system/wizarr:/data/database"
    ports:
      - "${WIZARR_PORT}:5690"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5.5623-ls163@sha256:f9151e5bc1025c6d0a630d503210cdcb6bb55a7cc098562609d96a408d838902
    container_name: prowlarr
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Detroit
    volumes:
      - "${APPDATA_DIR:-/opt/appdata}/media-system/prowlarr:/config"
    ports:
      - "${PROWLARR_PORT}:9696"

  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls321@sha256:ea6822c956d26db648b237919f41340318f32e5b7dcc4ba702cf256a0f5f3c12
    container_name: radarr
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Detroit
    volumes:
      - "${APPDATA_DIR:-/opt/appdata}/media-system/radarr:/config"
      - "/media/plexmedia01:/media01"
    ports:
      - "${RADARR_PORT}:7878"

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls329@sha256:44b06045a98bc1f237b9ffefc4b28dab64cb29305e4a2a94875ae93b5224e4cc
    container_name: sonarr
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Detroit
    volumes:
      - "${APPDATA_DIR:-/opt/appdata}/media-system/sonarr:/config"
      - "/media/plexmedia01:/media01"
    ports:
      - "${SONARR_PORT}:8989"

  bazarr:
    image: lscr.io/linuxserver/bazarr:v1.6.2-ls368@sha256:fb0437897eaa7f96cf6ac42f795f8dcc208d34ec969eac5d366454e767304eb9
    container_name: bazarr
    restart: always
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Detroit
    volumes:
      - "${APPDATA_DIR:-/opt/appdata}/media-system/bazarr:/config"
      - "/media/plexmedia01:/media01"
    ports:
      - "${BAZARR_PORT}:6767"

  samba:
    image: docker.io/servercontainers/samba:a3.24.1-s4.23.8-r0@sha256:06eb4c7aed0d0b705d45c09785f1eb96299a58004ed02ff048b59471aca2d481
    container_name: plex-samba
    restart: always
    environment:
      ACCOUNT_admin: admin123
      UID_admin: 1234
      #SAMBA_VOLUME_CONFIG_plex_flashdrive: "[plex_flashdrive]; path=/shares/plex_flashdrive; available = yes; browsable = yes; writable = yes; read only = no; force user = admin; public = yes; guest ok = yes"
      SAMBA_VOLUME_CONFIG_plexmedia01: "[plexmedia01]; path=/shares/plexmedia01; available = yes; browsable = yes; writable = yes; read only = no; force user = admin; public = no; guest ok = no"
    volumes:
      # - /media/usbdriveplex:/shares/plex_flashdrive
      - /media/plexmedia01:/shares/plexmedia01
    ports:
      - 445:445
    cap_add:
      - CAP_NET_ADMIN

  filebrowser:
    container_name: plex-filebrowser
    image: "filebrowser/filebrowser:s6@sha256:ee4ac79e52966a5f6247f99c7d667c1debfb277a3a61ab829f505aa8f4c74b21"
    restart: always
    volumes:
      - "/media:/files"
      - "${APPDATA_DIR:-/opt/appdata}/media-system/filebrowser/filebrowser.db:/database/filebrowser.db"
      - "./filebrowser_config.json:/config/settings.json"
    environment:
      - PUID=1000
      - PGID=1000
    ports:
      - "${PLEX_FILEBROWSER_PORT}:80"

  gluetun-vpn:
    container_name: gluetun-vpn
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    restart: always
    cap_add:
      - NET_ADMIN
    ports:
      - "${QBT_UI_PORT}:${QBT_UI_PORT}"
      - "51420:51420" # QBT
      - "51420:51420/udp" # QBT
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_PROVIDER}
      - OPENVPN_USER=${VPN_USERNAME}
      - OPENVPN_PASSWORD=${VPN_PASSWORD}
      - SERVER_COUNTRIES=${VPN_COUNTRIES}
      - VPN_TYPE=${VPN_TYPE}

  qbt:
    container_name: qbt
    image: linuxserver/qbittorrent:4.5.2@sha256:cd75ae74f83232b23a27ffef5d98f4bee41f247a2b626dcaf0b429b699c6b6a5
    restart: always
    network_mode: "service:gluetun-vpn"
    depends_on:
      - gluetun-vpn
    environment:
      - WEBUI_PORT=${QBT_UI_PORT}
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - "${APPDATA_DIR:-/opt/appdata}/media-system/qbt:/config"
      - "/media/plexmedia01:/plexmedia01"
      - "/media/plexmedia01:/media01"
    healthcheck:
        test: curl -s http://localhost:${QBT_UI_PORT}/api/v2/app/version
        interval: 20s
        timeout: 10s
        start_period: 30s

  qui:
    container_name: qui
    image: ghcr.io/autobrr/qui:v1.33.1@sha256:c83ce0370ab372c931ccb3f0ddd0eb1bc850026ce9eafc13ce94443f6f2a2cd3
    restart: always
    user: "1000:1000"
    depends_on:
      - qbt
    environment:
      - QUI__HOST=0.0.0.0
      - TZ=America/Detroit
    volumes:
      - "/opt/appdata/qui:/config" # outside the stack folder so Komodo can own /opt/stacks
    ports:
      - "${QUI_PORT:-8090}:7476"

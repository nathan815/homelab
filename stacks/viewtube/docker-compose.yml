version: '3'

services:
  viewtube:
    restart: unless-stopped
    # Or use mauriceo/viewtube:dev for the development version
    image: mauriceo/viewtube:dev@sha256:aae4e1850bd16f0e6ad0af9c98bf1e82a758ba77c63ea05334ef907f4b58ac68
    # ViewTube will not start until the database and redis are ready
    depends_on:
      - viewtube-mongodb
      - viewtube-redis
    # Make sure all services are in the same network
    networks:
      - viewtube
    volumes:
      # This will map ViewTube's data directory to ${APPDATA_DIR:-/opt/appdata}/viewtube/viewtube/
      - ${APPDATA_DIR:-/opt/appdata}/viewtube/viewtube:/data
    environment:
      - VIEWTUBE_DATABASE_HOST=viewtube-mongodb
      - VIEWTUBE_REDIS_HOST=viewtube-redis
    ports:
      - 8099:8066

  viewtube-mongodb:
    restart: unless-stopped
    image: mongo:7@sha256:8bb4442761a63a8dda452744082cdac9644b429807eb977b42324a63cef59ca4
    networks:
      - viewtube
    volumes:
      - ${APPDATA_DIR:-/opt/appdata}/viewtube/db:/data/db

  viewtube-redis:
    restart: unless-stopped
    image: redis:7@sha256:b6b6e3dc0c0952737748e55d5d885272840c7e42ba41ab1d5489f693419882f5
    networks:
      - viewtube
    volumes:
      - ${APPDATA_DIR:-/opt/appdata}/viewtube/redis:/data

networks:
  viewtube:

---
services:

  # Woodpecker CI server - https://woodpecker.lan.nathancj.com
  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v3.20.1@sha256:0f31560e29d67ec4a06d6eeee4bac38d2a2697a6a741b8a0db3998180f3a3517
    container_name: woodpecker-server
    restart: unless-stopped
    ports:
      - "${WOODPECKER_PORT:-8001}:8000"
    volumes:
      - woodpecker-server-data:/var/lib/woodpecker
    environment:
      - WOODPECKER_HOST=${WOODPECKER_HOST}
      - WOODPECKER_ADMIN=${WOODPECKER_ADMIN}
      # Webhook URL GitHub calls (public, via cloudflared + nginx-public); UI/OAuth stay on WOODPECKER_HOST
      - WOODPECKER_EXPERT_WEBHOOK_HOST=${WOODPECKER_WEBHOOK_HOST}
      - WOODPECKER_GITHUB=true
      - WOODPECKER_GITHUB_CLIENT=${WOODPECKER_GITHUB_CLIENT}
      - WOODPECKER_GITHUB_SECRET=${WOODPECKER_GITHUB_SECRET}
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
      # Server-only key for signing gRPC JWTs; persisted so tokens survive restarts
      - WOODPECKER_GRPC_SECRET=${WOODPECKER_GRPC_SECRET}
    networks:
      - woodpecker

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v3.20.1@sha256:a7d7299a13add0b3936fa0ac9ed23507fe283a7fc7d9596c4289d7e8206541eb
    container_name: woodpecker-agent
    restart: unless-stopped
    depends_on:
      - woodpecker-server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Persists agent.conf (agent ID) so a recreated container reuses its registration instead of adding a new agent
      - woodpecker-agent-config:/etc/woodpecker
    environment:
      - WOODPECKER_SERVER=woodpecker-server:9000
      # Readable agent name in the UI (defaults to the container hostname)
      - WOODPECKER_HOSTNAME=${WOODPECKER_AGENT_HOSTNAME:-pi01-agent}
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
      - WOODPECKER_MAX_WORKFLOWS=${WOODPECKER_MAX_WORKFLOWS:-2}
    networks:
      - woodpecker

volumes:
  woodpecker-server-data:
  woodpecker-agent-config:

networks:
  woodpecker:
    name: woodpecker

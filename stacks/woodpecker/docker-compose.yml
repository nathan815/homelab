---
services:

  # Woodpecker CI server - http://woodpecker.lan.nathancj.com
  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v3
    container_name: woodpecker-server
    restart: unless-stopped
    ports:
      - "${WOODPECKER_PORT:-8001}:8000"
    volumes:
      - woodpecker-server-data:/var/lib/woodpecker
    environment:
      - WOODPECKER_HOST=${WOODPECKER_HOST}
      - WOODPECKER_ADMIN=${WOODPECKER_ADMIN}
      # Webhook URL GitHub calls (public, via cloudflared + nginx-public); UI/OAuth stay on WOODPECKER_HOST
      - WOODPECKER_EXPERT_WEBHOOK_HOST=${WOODPECKER_WEBHOOK_HOST}
      - WOODPECKER_GITHUB=true
      - WOODPECKER_GITHUB_CLIENT=${WOODPECKER_GITHUB_CLIENT}
      - WOODPECKER_GITHUB_SECRET=${WOODPECKER_GITHUB_SECRET}
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
      # Server-only key for signing gRPC JWTs; persisted so tokens survive restarts
      - WOODPECKER_GRPC_SECRET=${WOODPECKER_GRPC_SECRET}
    networks:
      - woodpecker

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v3
    container_name: woodpecker-agent
    restart: unless-stopped
    depends_on:
      - woodpecker-server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WOODPECKER_SERVER=woodpecker-server:9000
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
      - WOODPECKER_MAX_WORKFLOWS=${WOODPECKER_MAX_WORKFLOWS:-2}
    networks:
      - woodpecker

volumes:
  woodpecker-server-data:

networks:
  woodpecker:
    name: woodpecker

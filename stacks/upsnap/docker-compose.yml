services:
  
  # UpSnap Wake On LAN - http://upsnap.lan/
  upsnap:
    container_name: upsnap
    image: ghcr.io/seriousm4x/upsnap:4@sha256:036f8be0712ed4cc607c1852ad4afa3bae4e4c9df83415bdfab8d981a8183044
    network_mode: host
    restart: always
    volumes:
      - ./data:/app/pb_data
    entrypoint: /bin/sh -c "./upsnap serve --http 0.0.0.0:${UPSNAP_PORT}"
    healthcheck:
      test: curl -fs "http://localhost:${UPSNAP_PORT}/api/health" || exit 1
      interval: 10s

services:
  
  # UpSnap Wake On LAN - http://upsnap.lan/
  upsnap:
    container_name: upsnap
    image: ghcr.io/seriousm4x/upsnap:5@sha256:e01e61ac6bfbf34a2003364e1499faf2da0fba0a485e0f4b31c49b6576b95e9d
    network_mode: host
    labels:
      homelab.backup: "true"
    restart: always
    volumes:
      - ${APPDATA_DIR:-/opt/appdata}/upsnap:/app/pb_data
    entrypoint: /bin/sh -c "./upsnap serve --http 0.0.0.0:${UPSNAP_PORT}"
    healthcheck:
      test: curl -fs "http://localhost:${UPSNAP_PORT}/api/health" || exit 1
      interval: 10s

services:

  # Quicken Simplifi MCP server - http://docker-main.lan:8787/mcp
  # Source: https://github.com/nathan815/quicken-simplifi-mcp (CI pushes :latest, amd64 only)
  simplifi-mcp:
    # Built outside this repo, so no digest pin; IMAGE_TAG defaults to latest and
    # pull_policy: always picks up each new build on redeploy.
    image: ghcr.io/nathan815/quicken-simplifi-mcp:${IMAGE_TAG:-latest}
    platform: linux/amd64
    pull_policy: always
    container_name: simplifi-mcp
    labels:
      homelab.backup: "true"
    restart: always
    ports:
      - "${SIMPLIFI_MCP_PORT:-8787}:8787"
    environment:
      PORT: "8787"
      HOST: 0.0.0.0
      CACHE_DB_PATH: /app/data/cache.sqlite
      OAUTH_JWT_SECRET: ${OAUTH_JWT_SECRET:?set OAUTH_JWT_SECRET}
      ALLOWED_EMAIL: ${ALLOWED_EMAIL:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    volumes:
      # Holds the SQLite cache and the stored Simplifi tokens
      - "${APPDATA_DIR:-/opt/appdata}/simplifi-mcp:/app/data"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 20s

  # Public HTTPS via Tailscale Funnel: https://<TS_HOSTNAME>.<tailnet>.ts.net
  # (needs the `funnel` node attribute in the tailnet policy; see komodo/komodo.toml).
  # Only the app's /mcp + OAuth endpoints are reachable, all behind its OAuth.
  tailscale:
    image: tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    container_name: simplifi-mcp-tailscale
    restart: always
    depends_on:
      - simplifi-mcp
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY}
      TS_HOSTNAME: ${TS_HOSTNAME:?set TS_HOSTNAME}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - "${APPDATA_DIR:-/opt/appdata}/simplifi-mcp/tailscale:/var/lib/tailscale"
      - ./tailscale-serve.json:/config/serve.json:ro

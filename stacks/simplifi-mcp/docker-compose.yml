services:

  # Quicken Simplifi MCP server - http://docker-main.lan:8787/mcp
  # Public HTTPS: Cloudflare Tunnel (stacks/cloudflared on pi01) with a public hostname
  # -> http://docker-main.lan:8787, configured in the Zero Trust dashboard. Only the
  # app's /mcp + OAuth endpoints are exposed, all behind its OAuth (PUBLIC_BASE_URL).
  # Source: https://github.com/nathan815/quicken-simplifi-mcp (CI pushes :latest, amd64 only)
  simplifi-mcp:
    # Built outside this repo, so no digest pin; IMAGE_TAG defaults to latest and
    # pull_policy: always picks up each new build on redeploy.
    image: ghcr.io/nathan815/quicken-simplifi-mcp:${IMAGE_TAG:-latest}
    platform: linux/amd64
    pull_policy: always
    container_name: simplifi-mcp
    labels:
      homelab.backup: "true"
    restart: always
    ports:
      - "${SIMPLIFI_MCP_PORT:-8787}:8787"
    environment:
      PORT: "8787"
      HOST: 0.0.0.0
      CACHE_DB_PATH: /app/data/cache.sqlite
      OAUTH_JWT_SECRET: ${OAUTH_JWT_SECRET?set OAUTH_JWT_SECRET}
      ALLOWED_EMAIL: ${ALLOWED_EMAIL:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    volumes:
      # Holds the SQLite cache and the stored Simplifi tokens
      - "${APPDATA_DIR:-/opt/appdata}/simplifi-mcp:/app/data"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 20s

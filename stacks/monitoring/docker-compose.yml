---
networks:
  front-tier:
    name: monitoring-front-tier
  back-tier:
    name: monitoring-back-tier

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.1.0-beta-slim.1@sha256:599ebb0964cf699426a905b1f1f4e48d6bec9fb03b652170b824fbce35676766
    volumes:
      # Outside /opt/stacks/monitoring: Komodo owns that folder (git clone)
      - /mnt/data1/monitoring-data/uptime-kuma:/app/data
    labels:
      homelab.backup: "true"
    ports:
      - 3002:3001
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    container_name: prometheus
    # No homelab.backup label: the TSDB (8.4G in Nov 2026) is bigger than pi01's
    # free space. Losing it loses metric history only.
    user: root
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-admin-api'
      - '--storage.tsdb.retention.time=365d'
    ports:
      - "${PROMETHEUS_PORT}:9090"
    restart: always
    volumes:
      - ./prometheus:/etc/prometheus
      - /mnt/data1/monitoring-data/prometheus:/prometheus
    secrets:
      - home_assistant_token
    networks:
      - back-tier
    healthcheck:
      test: wget --no-verbose --tries=1 --spider "http://localhost:9090/-/healthy" || exit 1
      interval: 10s

  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    container_name: grafana
    labels:
      homelab.backup: "true"
    ports:
      - "${GRAFANA_PORT}:3000"
    restart: always
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      # Password only applies when Grafana creates its database (first start)
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD?set GRAFANA_ADMIN_PASSWORD}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      #- GF_SECURITY_COOKIE_SAMESITE=none
      #- GF_SECURITY_COOKIE_SECURE=true
      - HOSTNAME=grafana.lan.nathancj.com
      - GF_SERVER_DOMAIN=grafana.lan.nathancj.com
      - GF_SERVER_ROOT_URL=http://grafana.lan.nathancj.com
    volumes:
      - ./grafana:/etc/grafana/provisioning/datasources
      - grafana_data:/var/lib/grafana
    networks:
      - back-tier
      - front-tier
    healthcheck:
      test: wget --no-verbose --tries=1 --spider "http://localhost:3000/api/health" || exit 1
      interval: 10s

  # Grafana MCP server (separate project, Grafana has none built in):
  # http://<host>:${GRAFANA_MCP_PORT}/mcp. No auth of its own, so keep it LAN-only.
  # Access to Grafana is whatever the service account token's role allows.
  grafana-mcp:
    image: grafana/mcp-grafana:2.3.0@sha256:c27248b5919d09d64ea273ca1b128b32902c6796f6e2dfcd11849d4f1363f9ed
    container_name: grafana-mcp
    restart: always
    depends_on:
      - grafana
    command:
      - '-t'
      - 'streamable-http'
      - '--address'
      - '0.0.0.0:8000'
    environment:
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_SERVICE_ACCOUNT_TOKEN=${GRAFANA_MCP_TOKEN?set GRAFANA_MCP_TOKEN}
    ports:
      - "${GRAFANA_MCP_PORT}:8000"
    networks:
      - back-tier

  internet_ping:
    image: prom/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
    container_name: internet-ping
    restart: always
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./blackbox/config:/config
    expose:
      - 9115
    ports:
      - 9115:9115
    tty: true
    stdin_open: true
    command:
      - '--config.file=/config/blackbox.yml'
    networks:
      - back-tier
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:9115 || exit 1
      interval: 30s

  internet_speedtest:
    image: miguelndecarvalho/speedtest-exporter:v3.5.4@sha256:f1064d49124c7fc45faabb87c6c876a2fd04e92b3dc14d4b871301217ba30fed
    container_name: internet-speedtest
    restart: always
    expose:
      - 9798
    ports:
      - 9798:9798
    networks:
      - back-tier
    environment:
      - SPEEDTEST_CACHE_FOR=3600 # 1 hour

volumes:
  grafana_data:
    # Pinned to the name the Ansible-deployed project (~/monitoring) created
    name: monitoring_grafana_data

secrets:
  # Mounted at /run/secrets/home_assistant_token (read via credentials_file in
  # prometheus.yml). Value comes from the stack's .env, never committed.
  home_assistant_token:
    environment: HOME_ASSISTANT_TOKEN

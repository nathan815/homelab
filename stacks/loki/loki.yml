# Single-node Loki, filesystem storage. Retention: see limits_config below.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  retention_delete_delay: 2h

limits_config:
  # 30 days. Must be a multiple of the 24h index period. Loki has no size cap, so
  # disk use = ingest rate x this; raise it (e.g. 2160h = 90d) once `du` shows room.
  retention_period: 720h
  # Runaway protection: a crash-looping container can't fill the disk.
  # Excess lines are dropped (and counted in loki_discarded_samples_total).
  ingestion_rate_mb: 2
  ingestion_burst_size_mb: 4
  per_stream_rate_limit: 1MB
  per_stream_rate_limit_burst: 4MB
  allow_structured_metadata: true

analytics:
  reporting_enabled: false

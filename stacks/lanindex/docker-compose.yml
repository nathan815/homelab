---
version: "3"

services:

  # Home Index - http://home.lan/
  lanindex:
    # IMAGE_TAG is the deployed commit sha, set by Komodo (komodo/komodo.toml)
    image: ghcr.io/nathan815/lanindex:${IMAGE_TAG:-latest}
    platform: linux/arm64
    pull_policy: always
    container_name: lanindex
    restart: always
    ports:
      - "${LANINDEX_PORT}:80"
    healthcheck:
      test: python -c "import sys, requests; sys.exit(0) if requests.get('http://localhost/ping').status_code == 200 else sys.exit(1)"
      interval: 10s
